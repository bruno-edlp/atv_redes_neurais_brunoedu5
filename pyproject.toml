[project]
name = "am-at2-redes-neurais"
version = "0.1.0"
description = "MLP para previsao de churn de clientes de telecom, servida via FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "httpx>=0.27",
]

[tool.uv]
package = false
